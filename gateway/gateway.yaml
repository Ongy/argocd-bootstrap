apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  annotations:
    external-dns.alpha.kubernetes.io/target: kubernetes.local.ongy.net
spec:
  gatewayClassName: cilium
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    name: ssh-alt
    port: 7022
    protocol: TCP
  - allowedRoutes:
      namespaces:
        from: All
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - kind: Secret
        name: local-ca
  - allowedRoutes:
      namespaces:
        from: All
    name: tls
    port: 443
    protocol: TLS
    tls:
      mode: Passthrough
